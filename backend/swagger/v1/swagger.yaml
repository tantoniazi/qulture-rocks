---
openapi: 3.0.1
info:
  title: Qulture Organogram API
  version: v1
  description: Authentication endpoints. Domain operations (companies, employees,
    hierarchy) are exposed through GraphQL at POST /graphql.
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      required:
      - user
      properties:
        user:
          type: object
          required:
          - name
          - email
          - password
          - password_confirmation
          properties:
            name:
              type: string
              example: Ana Souza
            email:
              type: string
              format: email
              example: ana@example.com
            password:
              type: string
              minLength: 8
              example: password123
            password_confirmation:
              type: string
              example: password123
    LoginRequest:
      type: object
      required:
      - user
      properties:
        user:
          type: object
          required:
          - email
          - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`'
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
    PasswordRequest:
      type: object
      required:
      - user
      properties:
        user:
          type: object
          required:
          - email
          properties:
            email:
              type: string
              format: email
              example: ana@example.com
    PasswordResetRequest:
      type: object
      required:
      - user
      properties:
        user:
          type: object
          required:
          - token
          - password
          - password_confirmation
          properties:
            token:
              type: string
              description: Token from the reset link in the email
            password:
              type: string
              minLength: 8
              example: newpassword1
            password_confirmation:
              type: string
              example: newpassword1
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
paths:
  "/auth/signup":
    post:
      summary: Registers a user and returns a JWT
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupRequest"
  "/auth/login":
    post:
      summary: Signs in and returns a JWT
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
  "/auth/logout":
    delete:
      summary: Revokes the current JWT
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '204':
          description: signed out
        '401':
          description: missing or invalid token
  "/auth/password":
    post:
      summary: Sends password reset instructions to a registered email
      tags:
      - Authentication
      parameters: []
      responses:
        '202':
          description: instructions accepted (the same for registered and unknown
            emails)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordRequest"
    put:
      summary: Sets a new password using the token from the reset email
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: password updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
        '422':
          description: token invalid or passwords do not match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
