name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build images and prepare databases
        run: make setup

      - name: Run RSpec
        run: make test-backend

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build images and prepare databases
        run: make setup

      - name: Start the stack and run Playwright
        run: make test-e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      # Only needed to debug a failure. Upload problems (for example, a full artifact quota)
      # must not turn a green test run red.
      - name: Upload Playwright report and traces
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
