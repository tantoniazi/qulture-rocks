services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qulture_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [qulture]

  backend:
    build: ./backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432
      PGUSER: postgres
      HOME: /tmp
      FRONTEND_URL: http://localhost:5173,http://frontend:5173
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [qulture]
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'uri';require 'net/http';begin;r=Net::HTTP.get_response(URI('http://localhost:3000/up'));exit(r.is_a?(Net::HTTPOK) ? 0 : 1);rescue;exit(1);end\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    image: node:22-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      HOME: /tmp
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks: [qulture]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # End-to-end and API integration tests (Playwright). Run with `make test-e2e` while the stack is up.
  # Host networking lets the browser reach the API at localhost, the same way a developer does.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /e2e
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:3000
    volumes:
      - ./e2e:/e2e

volumes:
  pgdata:

networks:
  qulture:
    driver: bridge
